version: "3.8"

services:
  # -------------------------------------------------------------------------
  # Neo4j - Graph database for topological relationship tracking
  # -------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.15-community
    container_name: morpho_neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/morphosphere_neo4j_secret_2024
      - NEO4J_PLUGINS=\["apoc"\]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - morphosphere_net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "morphosphere_neo4j_secret_2024", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -------------------------------------------------------------------------
  # Qdrant - Vector database for multi-vector & hybrid search
  # -------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: morpho_qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/storage
    networks:
      - morphosphere_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -------------------------------------------------------------------------
  # Ollama - Local LLM inference server (quantized instruction models)
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: morpho_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - morphosphere_net
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # -------------------------------------------------------------------------
  # Backend - FastAPI application
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: morpho_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=morphosphere_neo4j_secret_2024
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5-coder:7b
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - morphosphere_net
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Frontend - React application
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: morpho_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - morphosphere_net
    restart: unless-stopped

# -------------------------------------------------------------------------
# Named Volumes
# -------------------------------------------------------------------------
volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  ollama_data:

# -------------------------------------------------------------------------
# Network
# -------------------------------------------------------------------------
networks:
  morphosphere_net:
    driver: bridge